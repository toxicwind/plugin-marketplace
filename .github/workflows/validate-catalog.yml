name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  # Bump-plugin-shas opens PRs with GITHUB_TOKEN, which does not trigger
  # on:pull_request. That workflow re-dispatches this one against each
  # bump/* branch so the required `validate` check can still run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate catalog
        run: python3 scripts/validate-catalog.py

      - name: Check plugin index is up to date
        run: python3 scripts/generate-plugin-index.py --check
